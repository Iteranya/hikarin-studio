<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hikarin Studio</title>
<link rel="stylesheet" href="studio.css">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>

<!-- ── TOP BAR ─────────────────────────────────────────────────────── -->
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">H</span>
    <span class="brand-name">Hikarin Studio</span>
  </div>

  <div class="project-info" id="project-info">
    <span class="chip" id="project-name">no project open</span>
    <span class="chip subtle" id="project-character">—</span>
  </div>

  <div class="topbar-actions">
    <select id="project-select" class="select" title="Open a project"></select>
    <button class="btn" id="btn-new" title="Create a new project">New</button>
    <button class="btn" id="btn-duplicate" title="Duplicate current project">Duplicate</button>
    <button class="btn" id="btn-rename" title="Rename current project">Rename</button>
    <button class="btn" id="btn-delete" title="Delete current project">Delete</button>
    <button class="btn" id="btn-import" title="Import a .hikarin.zip project bundle">Import</button>
    <input type="file" id="file-import" accept=".zip" hidden>
    <button class="btn" id="btn-assets" disabled title="Add images, characters and sounds">🎨 Assets</button>
    <button class="btn" id="btn-save" title="Save (Ctrl+S)">💾 Save</button>
    <button class="btn primary" id="btn-play" disabled title="Test this scene">▶ Play</button>
    <select id="export-format" class="select" title="Export format">
      <option value="pack">Pack (.zip)</option>
      <option value="json">Story (.json)</option>
      <option value="txt">Script (.txt)</option>
      <option value="md">Script (.md)</option>
      <option value="bundle">Project (.hikarin.zip)</option>
    </select>
    <button class="btn" id="btn-export" disabled title="Export current project">📦 Export</button>
  </div>
</header>

<!-- ── MAIN ────────────────────────────────────────────────────────── -->
<main class="workspace">

  <!-- PALETTE -->
  <aside class="pane palette" id="palette">
    <div class="pane-head">Blocks</div>
    <div class="palette-body" id="palette-body">
      <!-- filled by studio.js -->
    </div>
  </aside>

  <!-- CENTRE: tabs + block list -->
  <section class="pane centre" id="centre">
    <div class="tabs" id="tabs">
      <!-- filled by studio.js -->
    </div>

    <div class="blocklist" id="blocklist"></div>

    <div class="empty-state" id="empty-state">
      <p class="empty-title">No story open</p>
      <p class="empty-hint">Open a folder, or press <b>New</b> to start one.</p>
    </div>

  </section>

  <!-- INSPECTOR -->
  <aside class="pane inspector" id="inspector">
    <div class="pane-head pane-head-row">
      <span>Inspector</span>
      <button class="btn tiny" id="btn-add-say" title="Add a Say block and jump straight to editing it">+ Say</button>
    </div>
    <div class="inspector-body" id="inspector-body">
      <div class="empty-state small">
        <p class="empty-hint">Select a block to edit it.</p>
      </div>
    </div>
  </aside>

  <!-- OUTLINE -->
  <aside class="pane outline" id="outline">
    <div class="pane-head">Outline</div>
    <div class="outline-body" id="outline-body">
      <div class="empty-state small">
        <p class="empty-hint">Labels appear here.</p>
      </div>
    </div>
  </aside>

</main>

<!-- ── MOBILE PANE NAV (visible ≤900px only) ───────────────────────── -->
<nav class="mobile-nav" id="mobile-nav" aria-label="Pane navigation">
  <button class="mobile-nav-btn" data-pane="palette">🧩 Blocks</button>
  <button class="mobile-nav-btn active" data-pane="centre">📝 Editor</button>
  <button class="mobile-nav-btn" data-pane="inspector">🔧 Inspector</button>
  <button class="mobile-nav-btn" data-pane="outline">📑 Outline</button>
</nav>

<!-- ── STATUS BAR ──────────────────────────────────────────────────── -->
<footer class="statusbar">
  <span class="status-item" id="status-blocks">0 blocks</span>
  <span class="status-item" id="status-labels">0 labels</span>
  <span class="status-item" id="status-compile">not compiled</span>
  <span class="status-spacer"></span>
  <button class="btn tiny" id="btn-compile" disabled>Validate</button>
</footer>

<!-- ── BLOCK PICKER (modal) ────────────────────────────────────────── -->
<div class="modal-backdrop" id="picker-backdrop" hidden>
  <div class="modal" id="picker">
    <div class="modal-head">
      <span>Add a block</span>
      <button class="btn tiny ghost" id="picker-close">✕</button>
    </div>
    <div class="picker-body" id="picker-body"></div>
  </div>
</div>

<!-- ── ASSET MANAGER (modal) ───────────────────────────────────────── -->
<div class="modal-backdrop" id="assets-backdrop" hidden>
  <div class="modal assets-modal">
    <div class="modal-head">
      <span>Assets — <span id="assets-project">—</span></span>
      <div class="modal-head-actions">
        <button class="btn tiny ghost" id="assets-refresh" title="Re-read the folders on disk">↻</button>
        <button class="btn tiny ghost" id="assets-close" title="Close (Esc)">✕</button>
      </div>
    </div>

    <div class="asset-tabs" id="asset-tabs"></div>

    <div class="asset-drop" id="asset-drop">
      <div class="asset-drop-text">Drop images or audio here → <b id="asset-drop-target">—</b></div>
      <div class="asset-drop-row">
        <select id="asset-target" title="Where uploads land"></select>
        <button class="btn tiny" id="asset-browse">Choose files…</button>
        <input type="file" id="asset-file" multiple hidden>
      </div>
    </div>

    <div class="assets-body" id="assets-body"></div>
    <div class="assets-foot" id="assets-foot"></div>
    <div class="assets-status" id="assets-status"></div>
  </div>
</div>

<script type="module" src="studio.js"></script>
</body>
</html>
